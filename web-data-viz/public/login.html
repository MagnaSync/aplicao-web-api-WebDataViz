<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MagnaSync | Login</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/login.css">
    <link rel="icon" type="image/png" href="./assets/imgs/logo.png">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
</head>

<body>

    <div class="imagem-login">
        <img src="./assets/imgs/img-login.png" alt="">
    </div>

    <div class="login">
        <div class="topo-login">
            <a href="index.html" class="logo">
                <img src="./assets/imgs/logo.png" alt="Logo MagnaSync" class="logo-img">
                <span>Magna<span>Sync</span></span>
            </a>
            <a href="index.html" class="voltar" title="Voltar para a página inicial">&larr; Início</a>
        </div>

        <div class="alerta_erro">
            <div class="card_erro" id="cardErro">
                <span id="mensagem_erro"></span>
            </div>
        </div>
        <div class="container">
            <div class="card-login">
                <h2 id="titulo-card-login">Olá de volta!</h2>

                <!-- FORMULÁRIO DE LOGIN -->
                <div class="formulario" id="form-login-principal">
                    <div class="campo">
                        <span>E-mail Corporativo:</span>
                        <input id="email_input" type="text" placeholder="exemplo@hospital.com.br">
                    </div>
                    <div class="campo">
                        <span>Senha:</span>
                        <input id="senha_input" type="password" placeholder="******">
                        <a href="#" onclick="alternarRecuperacaoSenha(true); return false;"
                            style="display: block; text-align: right; font-size: 0.85rem; margin-top: 6px; color: #1d4ed8; text-decoration: none;">
                            Esqueci minha senha
                        </a>
                    </div>
                    <button class="botao" onclick="entrar()">Entrar no Sistema</button>
                </div>

                <!-- FORMULÁRIO DE REDEFINIÇÃO DE SENHA -->
                <div class="formulario" id="form-recuperar-senha" style="display: none;">
                    <div class="campo">
                        <span>E-mail Cadastrado:</span>
                        <input id="recuperar_email_input" type="email" placeholder="exemplo@hospital.com.br">
                    </div>
                    <div class="campo">
                        <span>Nova Senha:</span>
                        <input id="recuperar_nova_senha_input" type="password" placeholder="******">
                    </div>
                    <div class="campo">
                        <span>Confirmar Nova Senha:</span>
                        <input id="recuperar_confirmar_senha_input" type="password" placeholder="******">
                    </div>
                    <button class="botao" onclick="redefinirSenha()">Salvar Nova Senha</button>
                    <a href="#" onclick="alternarRecuperacaoSenha(false); return false;"
                        style="display: block; text-align: center; font-size: 0.85rem; margin-top: 10px; color: #64748b; text-decoration: none;">
                        &larr; Voltar para o login
                    </a>
                </div>

                <div id="div_aguardar" class="loading-div">
                    <div class="spinner"></div>
                    <span>Autenticando acesso...</span>
                </div>

                <div id="div_erros_login"></div>
            </div>
        </div>

        <div class="ajuda-login">
            <span>Precisa de ajuda ou ainda não possui acesso?</span>
            <a href="index.html#contato">Fale com a equipe de TI</a>
        </div>

    </div>

    <script>
        var timerMensagemLogin = null;

        function entrar() {
            aguardar();

            var emailVar = email_input.value.trim();
            var senhaVar = senha_input.value;

            if (emailVar == "" || senhaVar == "") {
                cardErro.style.display = "block";
                mensagem_erro.innerHTML = "Preencha e-mail e senha para entrar.";
                finalizarAguardar();
                agendarSumirMensagem();
                return false;
            }

            sumirMensagem();

            fetch("/usuarios/autenticar", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    emailServer: emailVar,
                    senhaServer: senhaVar
                })
            }).then(function (resposta) {
                if (resposta.ok) {
                    resposta.json().then(function (json) {
                        sessionStorage.EMAIL_USUARIO = json.email;
                        sessionStorage.NOME_USUARIO = json.nome;
                        sessionStorage.ID_USUARIO = json.id;
                        sessionStorage.CARGO_USUARIO = json.cargo;
                        sessionStorage.ID_HOSPITAL = json.hospital;
                        if (json.nome_hospital) {
                            sessionStorage.NOME_HOSPITAL = json.nome_hospital;
                        }

                        setTimeout(function () {
                            if (json.cargo === "Administração" && json.hospital == 1) {
                                window.location = "./cadastroHospital.html";
                            } else if (json.cargo == "Analista") {
                                window.location = "./dashboard/dashboardpedro.html";
                            }
                             else {
                                window.location = "./dashboard/dashboard.html";
                            }
                        }, 1000);
                    });
                } else {
                    resposta.text().then(function (texto) {
                        console.error(texto);
                        finalizarAguardar(texto);
                    });
                }
            }).catch(function (erro) {
                console.log(erro);
                finalizarAguardar("Não foi possível conectar ao servidor.");
            });

            return false;
        }

        function agendarSumirMensagem() {
            if (timerMensagemLogin) {
                clearTimeout(timerMensagemLogin);
            }
            timerMensagemLogin = setTimeout(sumirMensagem, 5000);
        }

        function sumirMensagem() {
            cardErro.style.display = "none";
        }

        function alternarRecuperacaoSenha(mostrarRecuperacao) {
            sumirMensagem();
            var formLogin = document.getElementById("form-login-principal");
            var formRecuperar = document.getElementById("form-recuperar-senha");
            var titulo = document.getElementById("titulo-card-login");

            if (mostrarRecuperacao) {
                formLogin.style.display = "none";
                formRecuperar.style.display = "flex";
                titulo.textContent = "Redefinir Senha";
                // Preenche automaticamente se o usuário já digitou o e-mail no login
                if (email_input.value.trim() !== "") {
                    recuperar_email_input.value = email_input.value.trim();
                }
            } else {
                formRecuperar.style.display = "none";
                formLogin.style.display = "flex";
                titulo.textContent = "Olá de volta!";
            }
        }

        function exibirAlertaLogin(texto, sucesso) {
            cardErro.style.display = "block";
            cardErro.style.borderColor = sucesso ? "#16a34a" : "";
            cardErro.style.color = sucesso ? "#15803d" : "";
            mensagem_erro.innerHTML = texto;
            agendarSumirMensagem();
        }

        function redefinirSenha() {
            var emailVar = recuperar_email_input.value.trim();
            var novaSenhaVar = recuperar_nova_senha_input.value;
            var confirmarVar = recuperar_confirmar_senha_input.value;

            if (!emailVar || !novaSenhaVar || !confirmarVar) {
                exibirAlertaLogin("Preencha o e-mail e a nova senha.", false);
                return false;
            }
            if (novaSenhaVar !== confirmarVar) {
                exibirAlertaLogin("As senhas digitadas não coincidem.", false);
                return false;
            }

            fetch("/usuarios/redefinirSenha", {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    emailServer: emailVar,
                    novaSenhaServer: novaSenhaVar
                })
            })
                .then(function (resposta) {
                    if (resposta.ok) {
                        email_input.value = emailVar;
                        senha_input.value = "";
                        recuperar_nova_senha_input.value = "";
                        recuperar_confirmar_senha_input.value = "";
                        alternarRecuperacaoSenha(false);
                        exibirAlertaLogin("Senha alterada com sucesso! Faça login com a nova senha.", true);
                    } else {
                        resposta.text().then(function (texto) {
                            exibirAlertaLogin(texto || "Não foi possível redefinir a senha.", false);
                        });
                    }
                })
                .catch(function (erro) {
                    console.log(erro);
                    exibirAlertaLogin("Erro ao conectar ao servidor.", false);
                });

            return false;
        }
    </script>

</body>

</html>

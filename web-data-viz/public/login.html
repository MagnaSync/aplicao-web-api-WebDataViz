<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MagnaSync | Login</title>

    <script src="./js/sessao.js"></script>

    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="./css/login.css">
    <link rel="icon" type="image/png" href="./assets/imgs/logo.png">
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
</head>

<body>

    <div class="imagem-login">
        <img src="./assets/imgs/img-login.png" alt="">
    </div>

    <div class="login">
        <div class="topo-login">
            <a href="index.html" class="logo">
                <img src="./assets/imgs/logo.png" alt="Logo MagnaSync" class="logo-img">
                <span>Magna<span>Sync</span></span>
            </a>
            <a href="index.html" class="voltar">Início</a>
        </div>

        <div class="alerta_erro">
            <div class="card_erro" id="cardErro">
                <span id="mensagem_erro"></span>
            </div>
        </div>
        <div class="container">
            <div class="card-login">
                <span class="etiqueta-secao clara">Acesso Restrito</span>
                <h2>Olá de volta!</h2>
                <p class="subtitulo">Digite suas credenciais institucionais para acessar o painel de monitoramento.</p>
                <div class="formulario">
                    <div class="campo">
                        <span>E-mail Corporativo:</span>
                        <input id="email_input" type="text" placeholder="exemplo@hospital.com.br">
                    </div>
                    <div class="campo">
                        <span>Senha:</span>
                        <input id="senha_input" type="password" placeholder="******">
                    </div>
                    <button class="botao" onclick="entrar()">Entrar no Sistema</button>
                </div>

                <div id="div_aguardar" class="loading-div">
                    <div class="spinner"></div>
                    <span>Autenticando acesso...</span>
                </div>

                <div id="div_erros_login"></div>
            </div>
        </div>

        <div class="ajuda-login">
            <span>Precisa de ajuda ou ainda não possui acesso?</span>
            <a href="index.html#contato">Fale com a equipe de TI</a>
        </div>

    </div>

</body>

</html>

<script>
 function entrar() {
        aguardar();
        console.log("inicio da funcao entrar()");
        var emailVar = email_input.value;
        var senhaVar = senha_input.value;

        if (emailVar == "" || senhaVar == "") {
            cardErro.style.display = "block"
            mensagem_erro.innerHTML = "(Mensagem de erro para todos os campos em branco)";
            finalizarAguardar();
            return false;
        }
        else {
            setInterval(sumirMensagem, 5000)
        }
        console.log("infos coletadas, enviando para o servidor...");
        console.log("FORM LOGIN: ", emailVar);
        console.log("FORM SENHA: ", senhaVar);

        fetch("/usuarios/autenticar", {
            
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: emailVar,
                senhaServer: senhaVar
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id;

                    setTimeout(function () {
                        console.log("cheguei aqui");
                        window.location = "./dashboard/dashboard.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                console.log("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                    finalizarAguardar(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })

        return false;
    }

    function sumirMensagem() {
        cardErro.style.display = "none"
    }

</script>

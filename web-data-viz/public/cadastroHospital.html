<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MagnaSync | Cadastro de Hospital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/dashboard.css">
  <link rel="stylesheet" href="./css/cadastroHospital.css">
  <link rel="icon" type="image/png" href="./assets/imgs/logo.png">
  <script src="./js/cadastro.js" defer></script>
</head>
<body>
  <div class="layout">
    <aside class="dash-sidebar">
      <a href="./index.html" class="sidebar-logo" title="Voltar para a página inicial">
        <img src="./assets/imgs/logo.png" alt="Logo MagnaSync" class="logo-img" />
        <span>Magna<span>Sync</span></span>
      </a>

      <nav class="sidebar-nav" aria-label="Navegação do Dashboard">
        <a href="#suporte" class="nav-link">Suporte</a>
        <a href="#cadastrarHospital" class="nav-link active">Cadastrar Hospital</a>
      </nav>

      <div class="sidebar-footer">
        <a href="./index.html" class="button-exit" onclick="sessionStorage.clear()" title="Encerrar sessão e voltar para a página inicial">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
            <polyline points="16 17 21 12 16 7" />
            <line x1="21" y1="12" x2="9" y2="12" />
          </svg>
          <span>Sair</span>
        </a>
        <div class="user-profile">
          <div class="user-avatar" id="sidebar-user-avatar">EC</div>
          <div class="user-info">
            <span class="user-name" id="sidebar-user-name">Eng. Lucas Silva</span>
            <span class="user-role" id="sidebar-user-role">TI Hospitalar</span>
          </div>
        </div>
      </div>
    </aside>

    <main class="pagina">
      <h1 class="pagina__titulo">Cadastro de Hospital</h1>

      <section class="card">
        <h2 class="card__titulo">Novo Hospital</h2>

        <div id="mensagem_hospital" style="display:none;"></div>

        <form id="form-hospital" onsubmit="return false;" autocomplete="off">

          <div class="campo">
            <label for="nome_hospital_input">Nome do hospital</label>
            <input type="text" id="nome_hospital_input" name="nome" maxlength="150"
                   placeholder="Ex: Hospital Central" required>
          </div>

          <div class="linha">
            <div class="campo">
              <label for="cnpj_hospital_input">CNPJ</label>
              <input type="text" id="cnpj_hospital_input" name="cnpj" maxlength="14"
                     inputmode="numeric" pattern="\d{14}"
                     title="Digite os 14 números do CNPJ, sem pontos ou traços"
                     placeholder="Somente números (14 dígitos)" required>
            </div>

            <div class="campo">
              <label for="telefone_hospital_input">Telefone</label>
              <input type="tel" id="telefone_hospital_input" name="telefone" maxlength="20"
                     placeholder="Ex: (11) 3456-7890" required>
            </div>
          </div>

          <div class="campo">
            <label for="email_hospital_input">E-mail</label>
            <input type="email" id="email_hospital_input" name="email" maxlength="150"
                   placeholder="Ex: contato@hospitalcentral.com.br" required>
          </div>

          <div class="linha">
            <div class="campo">
              <label for="cep_hospital_input">CEP</label>
              <input type="text" id="cep_hospital_input" name="cep" maxlength="8"
                     inputmode="numeric" pattern="\d{8}"
                     title="Digite os 8 números do CEP, sem traço"
                     placeholder="Somente números (8 dígitos)" required>
            </div>

            <div class="campo">
              <label for="numero_hospital_input">Número</label>
              <input type="text" id="numero_hospital_input" name="numero" maxlength="10"
                     placeholder="Ex: 1200" required>
            </div>
          </div>

          <div class="acoes">
            <button type="button" id="btn-limpar-hospital" class="btn btn--secundario">Limpar</button>
            <button type="button" id="btn-cadastrar-hospital" onclick="cadastrarHospital()" class="btn btn--primario">Cadastrar Hospital</button>
          </div>
        </form>

      </section>
    </main>
  </div>
</body>
</html>

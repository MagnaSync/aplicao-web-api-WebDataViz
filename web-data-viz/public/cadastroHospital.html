<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MagnaSync | Cadastro de Hospital</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./css/cadastroHospital.css">
  <link rel="stylesheet" href="./css/dashboard.css">
  <link rel="icon" type="image/png" href="./assets/imgs/logo.png">
  <script src="./js/sessao.js"></script>
</head>
<body>
  <div class="layout">
        <aside class="dash-sidebar">
      <a href="../index.html" class="sidebar-logo" title="Voltar para a página inicial">
        <img src="../assets/imgs/logo.png" alt="Logo MagnaSync" class="logo-img" />
        <span>Magna<span>Sync</span></span>
      </a>

      <nav class="sidebar-nav" aria-label="Navegação do Dashboard">
        <a href="#suporte" class="nav-link">Suporte</a>
        <a href="#cadastrarHospital" class="nav-link active">Cadastrar Hospital</a>
    
      </nav>

      <div class="sidebar-footer">
        <div class="user-profile">
          <div class="user-avatar" id="sidebar-user-avatar">EC</div>
          <div class="user-info">
            <span class="user-name" id="sidebar-user-name">Eng. Lucas Silva</span>
            <span class="user-role" id="sidebar-user-role">Engenharia Clínica</span>
          </div>
        </div>
      </div>
    </aside>

    <main class="pagina">
    <h1 class="pagina__titulo">Cadastro de Hospital</h1>

    <section class="card">
      <h2 class="card__titulo">Novo Hospital</h2>

      <!-- Ajuste action/method quando o back-end estiver pronto -->
      <form id="form-hospital" action="#" method="post" autocomplete="off">

        <div class="campo">
          <label for="nome">Nome do hospital</label>
          <input type="text" id="nome" name="nome" maxlength="150"
                 placeholder="Ex: Hospital Central" required>
        </div>

        <div class="linha">
          <div class="campo">
            <label for="cnpj">CNPJ</label>
            <input type="text" id="cnpj" name="cnpj" maxlength="14"
                   inputmode="numeric" pattern="\d{14}"
                   title="Digite os 14 números do CNPJ, sem pontos ou traços"
                   placeholder="Somente números (14 dígitos)" required>
          </div>

          <div class="campo">
            <label for="telefone">Telefone</label>
            <input type="tel" id="telefone" name="telefone" maxlength="20"
                   placeholder="Ex: (11) 3456-7890" required>
          </div>
        </div>

        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" maxlength="150"
                 placeholder="Ex: contato@hospitalcentral.com.br" required>
        </div>

        <div class="linha">
          <div class="campo">
            <label for="cep">CEP</label>
            <input type="text" id="cep" name="cep" maxlength="8"
                   inputmode="numeric" pattern="\d{8}"
                   title="Digite os 8 números do CEP, sem traço"
                   placeholder="Somente números (8 dígitos)" required>
          </div>

          <div class="campo">
            <label for="numero">Número</label>
            <input type="text" id="numero" name="numero" maxlength="10"
                   placeholder="Ex: 1200" required>
          </div>
        </div>

        <div class="acoes">
          <button type="reset" class="btn btn--secundario">Limpar</button>
          <button type="submit" class="btn btn--primario">Cadastrar Hospital</button>
        </div>
      </form>
    </section>
    </main>
  </div>
</body>
<script>
    document.addEventListener('DOMContentLoaded', () => {
  // Time filter buttons (if present)
  const timeButtons = document.querySelectorAll('.time-btn');
  timeButtons.forEach((btn) => {
    btn.addEventListener('click', () => {
      timeButtons.forEach((b) => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });
    });
</script>
</html>
